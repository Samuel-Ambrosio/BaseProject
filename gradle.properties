# Project-wide Gradle settings.
# For more details visit https://docs.gradle.org/current/userguide/build_environment.html
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official

# ---------------------------------------------------------------------------------------------
# App identity. The only place to change when creating a new app from this template.
#   app.name           Launcher label (generated as @string/app_name). The Gradle root project
#                      takes the same value without whitespace.
#   app.applicationId  Unique id on the Play Store. Must match the package in google-services.json.
# ---------------------------------------------------------------------------------------------
app.name=BaseProject
app.applicationId=com.samuelav.baseproject
